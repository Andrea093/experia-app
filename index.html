  <!-- Favicon + PWA -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23E8732C'/><text y='24' x='5' font-size='22' font-family='sans-serif' font-weight='900' fill='white'>C</text></svg>" />

  <!-- Preconnect para Google Fonts (usado en styles.css) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Tema: se aplica antes del primer paint para evitar flash (FOUC) -->
  <script>
    (function () {
      try {
        // El modo oscuro solo se aplica si hay una sesión de Supabase activa.
        // Sin sesión, el usuario verá la landing/login, que SIEMPRE es modo claro.
        var hasSession = false;
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.lastIndexOf('sb-', 0) === 0 && k.indexOf('-auth-token') !== -1) { hasSession = true; break; }
        }
        var theme = localStorage.getItem('experia-theme');
        if (hasSession && (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches))) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
        var accent = localStorage.getItem('experia-accent');
        if (accent && accent !== 'morado') {
          document.documentElement.setAttribute('data-accent', accent);
        }
        if (localStorage.getItem('experia-contrast') === 'alto') {
          document.documentElement.setAttribute('data-contrast', 'alto');
        }
      } catch (e) { /* localStorage bloqueado: tema claro por defecto */ }
    })();
  </script>
</head>
<body>
  <!-- Skip link: permite a usuarios de teclado/lectores de pantalla saltar la navegación -->
